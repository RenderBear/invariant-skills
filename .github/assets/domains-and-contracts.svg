<svg xmlns="http://www.w3.org/2000/svg" width="768" height="320" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Durable repository intent, local work, and Git as a causal substrate</title>
  <desc id="desc">Durable repository intent sits above local work and Git as a causal substrate. Progressive discovery moves upward, while mechanical verification moves downward.</desc>

  <defs>
    <marker id="up" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#58c7df"/>
    </marker>
    <marker id="down" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#70c99a"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#0d1117"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <rect x="160" y="38" width="640" height="70" rx="8" fill="#161c25" stroke="#303946"/>
    <text x="480" y="80" text-anchor="middle" fill="#f0f3f6" font-size="21" font-weight="600">Durable repo intent</text>

    <text x="480" y="158" text-anchor="middle" fill="#e4e8ed" font-size="18" font-weight="600">Local work</text>
    <path d="M 312 212 C 372 177, 420 242, 480 212 C 540 182, 588 247, 648 212" fill="none" stroke="#778293" stroke-width="2" stroke-linecap="round"/>
    <circle cx="312" cy="212" r="4" fill="#58c7df"/>
    <circle cx="480" cy="212" r="4" fill="#9b8cda"/>
    <circle cx="648" cy="212" r="4" fill="#d6a15f"/>
    <text x="480" y="248" text-anchor="middle" fill="#828b99" font-size="13">plans · claims · leases</text>

    <rect x="160" y="294" width="640" height="66" rx="8" fill="#141a22" stroke="#303946"/>
    <text x="480" y="335" text-anchor="middle" fill="#f0f3f6" font-size="20" font-weight="600">Git as a causal substrate</text>

    <path d="M 135 327 C 96 274, 98 124, 146 73" fill="none" stroke="#58c7df" stroke-width="2.25" stroke-linecap="round" marker-end="url(#up)"/>
    <text x="83" y="200" text-anchor="middle" fill="#69ccdf" font-size="10" font-weight="650" letter-spacing="1.2" transform="rotate(-90 83 200)">PROGRESSIVE DISCOVERY</text>

    <path d="M 814 73 C 862 124, 864 274, 825 327" fill="none" stroke="#70c99a" stroke-width="2.25" stroke-linecap="round" marker-end="url(#down)"/>
    <text x="877" y="200" text-anchor="middle" fill="#7acda0" font-size="10" font-weight="650" letter-spacing="1.2" transform="rotate(90 877 200)">MECHANICAL VERIFICATION</text>
  </g>
</svg>
